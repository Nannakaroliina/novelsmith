<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Novelsmith: a pen nib struck on an anvil">
  <title>Novelsmith</title>
  <!-- jacket frame (ink-600) and ground (ink-900) -->
  <rect width="512" height="512" rx="24" fill="#2a2a2a"/>
  <rect x="20" y="20" width="472" height="472" rx="8" fill="#0e1013"/>
  <!-- anvil (snow-200) -->
  <path d="M84 300 Q120 292 160 290 L424 290 L424 330 L364 330 Q340 344 340 370 L340 388 L372 388 L386 420 L126 420 L140 388 L172 388 L172 370 Q172 346 152 334 Q118 322 84 300 Z" fill="#e6e4eb"/>
  <!-- sparks (blood-300) -->
  <g fill="#d9482b">
    <rect x="252" y="220" width="8" height="26" rx="4" transform="rotate(-60 256 290)"/>
    <rect x="252" y="220" width="8" height="26" rx="4" transform="rotate(60 256 290)"/>
    <rect x="252" y="226" width="8" height="20" rx="4" transform="rotate(-80 256 290)"/>
    <rect x="252" y="226" width="8" height="20" rx="4" transform="rotate(80 256 290)"/>
  </g>
  <!-- nib: lit facet (blood-300), shadow facet (blood-400) -->
  <path d="M256 290 L198 188 Q190 172 204 158 L228 134 L228 92 L256 92 Z" fill="#d9482b"/>
  <path d="M256 290 L314 188 Q322 172 308 158 L284 134 L284 92 L256 92 Z" fill="#c42a10"/>
  <!-- collar, slit and breather hole cut in ink -->
  <rect x="228" y="126" width="56" height="8" fill="#0e1013"/>
  <rect x="252" y="196" width="8" height="86" fill="#0e1013"/>
  <circle cx="256" cy="190" r="13" fill="#0e1013"/>
</svg>
