# Lint settings for the plugin's Python (scripts/, tests/). Standard library only, no build step.
# The scripts must run on Python 3.9, the oldest the Windows CI job tests.
line-length = 150
target-version = "py39"

[lint]
# pyflakes, pycodestyle and bugbear: real mistakes, not style churn. ISC catches a string
# concatenated by accident in a list (a missing comma), PLE invisible characters in source,
# RUF100 a `noqa` that no longer suppresses anything.
select = ["E", "F", "W", "B", "ISC", "PLE", "RUF100"]
ignore = [
  "E741",  # `l` for a line is the house idiom
  "B904",  # errors raised inside `except` are user-facing messages; the chained traceback adds nothing
  "B905",  # zip(strict=) needs Python 3.10
]
