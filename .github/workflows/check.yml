# Quality and lint checks (scripts/check.py --all: file hygiene, secrets, frontmatter, ruff, shellcheck on the
# hook command, the tests and the self-check), then the tests again with PyYAML, the parser Cowork uses.
# `claude plugin validate` is skipped here (no Claude Code on the runner); run scripts/check.py locally for it.
name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          # Not "3.x": PyYAML 6.0.3 has no wheel for Python 3.15, and --only-binary keeps package build
          # scripts from running here. Move up once requirements-dev.txt's PyYAML ships wheels for the newer one.
          python-version: "3.14"
      # shellcheck is preinstalled on the Ubuntu runner image.
      - name: Install ruff
        run: 'python -m pip install --disable-pip-version-check --only-binary=:all: -c requirements-dev.txt ruff'
      - name: Checks and tests (standard-library YAML parser)
        run: python -B scripts/check.py --all
      - name: Install PyYAML
        run: 'python -m pip install --disable-pip-version-check --only-binary=:all: -c requirements-dev.txt PyYAML'
      - name: Tests with PyYAML
        env:
          NOVELSMITH_REQUIRE_PYYAML: "1"
        run: python -B -m unittest discover -s tests
