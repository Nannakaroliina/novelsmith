# The canon guard against real Windows directory junctions (tests/test_windows_junctions.py, skipped elsewhere).
# Python 3.9 takes the guard's check for Pythons before 3.12; 3.x the newest.
name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  junctions:
    name: Junctions (Python ${{ matrix.python }})
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Windows junction tests
        run: python -B -m unittest tests.test_windows_junctions -v
